        <rect x="-12" y="-50" width="16" height="85" rx="2"/>
        <rect x="-50" y="-12" width="40" height="14"/>
        <path d="M 4,-50 L 35,-50 C 52,-50 58,-32 42,-16 C 30,-5 4,-8 4,-8 Z"/>
        <path d="M 12,-10 L 45,35 L 62,35 L 26,-12 Z"/>
