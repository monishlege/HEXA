      <use href="#leafPair" transform="translate(40,-5) rotate(30) scale(0.7)"/>
      <use href="#leafPair" transform="translate(60,0) rotate(45) scale(0.6)"/>
    </g>
    <g transform="translate(490, 565) scale(-1, 1) rotate(-15)">
      <use href="#leafPair" transform="scale(0.9)"/>
      <use href="#leafPair" transform="translate(20,-5) rotate(15) scale(0.8)"/>
      <use href="#leafPair" transform="translate(40,-5) rotate(30) scale(0.7)"/>
      <use href="#leafPair" transform="translate(60,0) rotate(45) scale(0.6)"/>
