      <circle cx="20" cy="18.5" r="1.5" fill="#990000"/>
      <circle cx="35" cy="18.5" r="1.5" fill="#fff"/>
      <path d="M -45,15 C -42,0 -52,-15 -55,-25 C -40,-10 -30,0 -25,15" fill="url(#goldBright)"/>
      <path d="M 45,15 C 42,0 52,-15 55,-25 C 40,-10 30,0 25,15" fill="url(#goldBright)"/>
      <path d="M -25,15 C -20,-10 -30,-25 -32,-35 C -15,-20 -5,-5 0,15" fill="url(#goldLight)"/>
      <path d="M 25,15 C 20,-10 30,-25 32,-35 C 15,-20 5,-5 0,15" fill="url(#goldLight)"/>
      <path d="M -12,15 C -8,-20 0,-40 0,-45 C 0,-40 8,-20 12,15 Z" fill="url(#goldBright)"/>
      <circle cx="0" cy="-47" r="3.5" fill="url(#goldLight)"/>
      <circle cx="-32" cy="-36" r="3" fill="url(#goldLight)"/>
      <circle cx="32" cy="-36" r="3" fill="url(#goldLight)"/>
      <circle cx="-55" cy="-26" r="2.5" fill="url(#goldLight)"/>
