    <polygon points="400,130 570,228 570,424 400,522 230,424 230,228" fill="none" stroke="url(#goldDark)" stroke-width="18" stroke-linejoin="round"/>
    <polygon points="400,130 570,228 570,424 400,522 230,424 230,228" fill="none" stroke="url(#goldBright)" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="400,130 570,228 570,424 400,522 230,424 230,228" fill="none" stroke="url(#goldLight)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="400,148 554,237 554,415 400,504 246,415 246,237" fill="#0b1329" stroke="url(#goldDark)" stroke-width="3"/>
    <polygon points="400,165 538,245 538,405 400,485 262,405 262,245" fill="none" stroke="url(#goldBevel)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="400,165 538,245 538,405 400,485 262,405 262,245" fill="none" stroke="url(#goldBright)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="400,180 525,252 525,398 400,470 275,398 275,252" fill="none" stroke="url(#goldLight)" stroke-width="1.5" opacity="0.8"/>

