      <path d="M -65,-50 L -46,-50 L -46,35 L -65,35 Z" fill="url(#goldBright)"/>
      <path d="M -65,-50 L -55.5,-50 L -55.5,35 L -65,35 Z" fill="url(#goldLight)"/>
      <path d="M -72,-52 L -39,-52 L -39,-45 L -72,-45 Z" fill="url(#goldLight)"/>
      <path d="M -72,33 L -39,33 L -39,40 L -72,40 Z" fill="url(#goldLight)"/>
      <path d="M -15,-50 L 4,-50 L 4,35 L -15,35 Z" fill="url(#goldBright)"/>
      <path d="M -15,-50 L -5.5,-50 L -5.5,35 L -15,35 Z" fill="url(#goldLight)"/>
