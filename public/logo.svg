      <path d="M 4,-50 L 35,-50 C 56,-50 56,-14 35,-14 L 4,-14 Z" fill="url(#goldBright)" opacity="0.15"/>
      <path d="M 10,-14 C 20,-14 25,-5 31,5 L 50,35 L 70,35 L 46,2 C 38,-10 28,-14 10,-14 Z" fill="url(#goldBright)"/>
      <path d="M 10,-14 C 20,-14 25,-5 31,5 L 50,35 L 57,35 L 34,2 C 28,-7 20,-14 10,-14 Z" fill="url(#goldLight)"/>
      <path d="M 45,33 L 73,33 L 73,39 L 45,39 Z" fill="url(#goldLight)"/>
      <path d="M -18,10 C -18,28 -3,38 8,24 C 16,14 4,0 -8,12" fill="none" stroke="url(#goldLight)" stroke-width="4"/>
    </g>

    <path d="M 200,545 Q 400,525 600,545 L 590,535 Q 400,515 210,535 Z" fill="url(#goldDark)" opacity="0.8"/>
    <path id="textArcTop" d="M 180,550 Q 400,520 620,550" fill="none" stroke="none"/>
    <path id="textArcBottom" d="M 250,625 Q 400,605 550,625" fill="none" stroke="none"/>
    <text font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" font-weight="bold" font-size="44" letter-spacing="7" fill="url(#goldBright)" text-anchor="middle" filter="url(#innerGlow)">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">HEXACORE</textPath>
    </text>
    <text font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" font-weight="bold" font-size="44" letter-spacing="7" fill="url(#goldLight)" text-anchor="middle" opacity="0.9" transform="translate(0, -1.5)">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">HEXACORE</textPath>
    </text>
    <path d="M 240,575 Q 400,555 560,575" fill="none" stroke="url(#goldBevel)" stroke-width="2"/>
    <polygon points="400,562 406,565 400,568 394,565" fill="url(#goldLight)"/>
    <circle cx="235" cy="575" r="3" fill="url(#goldBright)"/>
    <circle cx="565" cy="575" r="3" fill="url(#goldBright)"/>
    <text font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" font-weight="600" font-size="30" letter-spacing="10" fill="url(#goldLight)" text-anchor="middle">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">ROYAL</textPath>
    </text>
    <path d="M 360,635 Q 400,645 440,635 C 420,643 410,648 400,648 C 390,648 380,643 360,635 Z" fill="url(#goldBright)"/>
    <circle cx="400" cy="640" r="2.5" fill="url(#goldLight)"/>
