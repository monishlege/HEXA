<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#3b1a03"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <g id="leafPair">
      <path d="M0,0 Q-8,-12 -20,-10 Q-8,-2 0,0" fill="url(#goldBright)"/>
      <path d="M0,-4 Q-6,-16 -18,-14 Q-6,-6 0,-4" fill="url(#goldLight)"/>
    </g>
    <g id="fleurDeLis">
      <path d="M0,-25 C5,-15 12,-10 12,-2 C12,5 7,10 0,12 C-7,10 -12,5 -12,-2 C-12,-10 -5,-15 0,-25 Z" fill="url(#goldBright)"/>
      <path d="M0,-25 C2,-18 15,-8 18,2 C21,10 13,16 8,10 C5,6 4,0 0,3 C-4,0 -5,6 -8,10 C-13,16 -21,10 -18,2 C-15,-8 -2,-18 0,-25 Z" fill="url(#goldLight)"/>
      <path d="M-10,4 L10,4 L8,8 L-8,8 Z" fill="url(#goldDark)"/>
    </g>
