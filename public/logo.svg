    <use href="#fleurDeLis" x="330" y="120" transform="scale(0.8) rotate(-20 330 120) translate(-75,-20)"/>
    <use href="#fleurDeLis" x="470" y="120" transform="scale(0.8) rotate(20 470 120) translate(-125,-40)"/>

    <path d="M 270 200 C 230 220 210 260 225 300 C 235 320 250 330 245 350 C 240 370 210 390 200 410 C 190 430 205 460 225 480 C 240 495 250 520 270 540" fill="none" stroke="url(#goldBright)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 530 200 C 570 220 590 260 575 300 C 565 320 550 330 555 350 C 560 370 590 390 600 410 C 610 430 595 460 575 480 C 560 495 550 520 530 540" fill="none" stroke="url(#goldBright)" stroke-width="5" stroke-linecap="round"/>
    <use href="#fleurDeLis" x="195" y="410" transform="scale(0.7) rotate(-90 195 410) translate(-60, -30)"/>
    <use href="#fleurDeLis" x="605" y="410" transform="scale(0.7) rotate(90 605 410) translate(-55, -27)"/>

    <path d="M 260 545 C 240 560 230 590 260 610 C 290 625 320 590 290 570 C 270 555 250 580 275 595" fill="none" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 540 545 C 560 560 570 590 540 610 C 510 625 480 590 510 570 C 530 555 550 580 525 595" fill="none" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(310, 565) rotate(-15)">
