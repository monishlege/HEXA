      <rect x="-48" y="16" width="96" height="5" rx="2" fill="url(#goldLight)"/>
      <circle cx="-35" cy="18.5" r="1.5" fill="#fff"/>
      <circle cx="-20" cy="18.5" r="1.5" fill="#990000"/>
